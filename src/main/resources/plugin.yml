name: ShootCraft
version: 1.0.1
main: com.shootcraft.plugin.ShootCraftPlugin
api-version: 1.21
author: Claude
description: Mini-jeu PvP ShootCraft - duel au baton magique en arene avec systeme de kills multiples

commands:
  sc:
    description: Commande principale du plugin ShootCraft
    usage: /sc <create|delete|list|arenas|setlobby|addspawn|delspawn|setgamezone|removegamezone|setminplayers|setmaxplayers|settime|join|joinrandom|leave|start|stop|info|leaderboard>
    aliases: [shootcraft]

permissions:
  shootcraft.admin:
    description: Permission pour administrer/configurer les arenes ShootCraft
    default: op
  shootcraft.play:
    description: Permission pour jouer a ShootCraft
    default: true
