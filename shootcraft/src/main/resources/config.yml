# ===========================================
#           Configuration ShootCraft
# ===========================================

# Nombre de joueurs minimum pour lancer le compte a rebours du lobby
# (peut etre surcharge par arene via /sc setminplayers)
min-players: 2

# Nombre de joueurs maximum par arene (peut etre surcharge via /sc setmaxplayers)
max-players: 12

# Duree (secondes) du compte a rebours du lobby une fois le minimum de joueurs atteint
lobby-countdown: 20

# Duree (secondes) du compte a rebours quand l'arene est pleine (demarrage accelere)
lobby-countdown-fast: 8

# Duree par defaut (secondes) d'une partie, utilisee si l'arene n'a pas de duree
# specifique (voir /sc settime <arene> <secondes>)
default-game-time: 180

# Delai (secondes) avant qu'une arene terminee ne redevienne disponible (lobby) si
# aucun joueur n'a clique sur "Rejouer" / "Quitter"
restart-delay: 12

# Distance minimale (blocs) recherchee entre un point de spawn et tout autre joueur
# au moment de choisir un spawn aleatoire, pour eviter de faire reapparaitre deux
# joueurs au meme endroit
spawn-safe-radius: 4

# Effet de vitesse permanent applique a tous les joueurs pendant la partie
# (0 = Vitesse I, 1 = Vitesse II, ...)
permanent-speed-amplifier: 0

# ===========================================
#              Baton magique
# ===========================================
wand:
  # Anti-spam (millisecondes) entre deux tirs
  cooldown-ms: 300
  # Portee maximale du tir (blocs)
  max-distance: 120
  # Distance entre deux particules du rayon (plus petit = ligne plus dense)
  particle-step: 0.35
  # Tolerance (blocs) autour de la ligne de tir pour considerer qu'un joueur
  # est touche. Le rayon traverse les joueurs alignes (double/triple/quadruple
  # kill possible) mais s'arrete toujours au premier bloc solide rencontre.
  hit-radius: 0.6

# ===========================================
#                Turbo (vitesse)
# ===========================================
speed-boost:
  duration-seconds: 5
  cooldown-seconds: 10
  # Niveau de l'effet de vitesse (0 = Vitesse I, 1 = Vitesse II, ...)
  speed-amplifier: 1

